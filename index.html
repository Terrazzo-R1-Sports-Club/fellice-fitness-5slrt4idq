<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fellice Fitness</title>
    <meta name="description" content="Fellice Fitness - Terrazzo R1 Sports Club" />
    <meta name="author" content="Skip (https://goskip.dev)" />
    <meta property="og:image" content="/og-image.png" />
    <script>
      (function() {
        try {
          var storageKey = 'fellice-fitness-theme';
          var storedTheme = localStorage.getItem(storageKey);
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (storedTheme === 'dark' || (!storedTheme && prefersDark) || (storedTheme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
